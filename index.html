<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Woods Luikart</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; }
    canvas { display: block; width: 100vw; height: 100vh; }

    /* ── Name: two staggered lines ── */
    #name-overlay {
      position: fixed;
      top: 16px;
      left: 18px;
      font-family: 'Courier New', monospace;
      font-weight: bold;
      color: #fff;
      text-shadow: 1px 1px 0 #000, -1px -1px 0 #000,
                   1px -1px 0 #000, -1px  1px 0 #000;
      text-transform: uppercase;
      pointer-events: none;
      z-index: 10;
      user-select: none;
      line-height: 1;
    }
    #name-overlay .n1 {
      display: block;
      font-size: 18px;
      letter-spacing: 4px;
    }
    #name-overlay .n2 {
      display: block;
      font-size: 12px;
      letter-spacing: 8px;
      margin-left: 14px;
      margin-top: 4px;
      opacity: 0.72;
    }

    /* ── Bottom-centre hint ── */
    #drop-hint {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Courier New', monospace;
      font-size: 11px;
      color: rgba(255,255,255,0.45);
      pointer-events: none;
      z-index: 10;
      white-space: nowrap;
      letter-spacing: 1px;
    }

    /* ── Remove-skin button (hidden until a skin is active) ── */
    #remove-skin {
      position: fixed;
      bottom: 18px;
      right: 18px;
      display: none;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.6);
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.25);
      padding: 4px 10px;
      cursor: pointer;
      z-index: 10;
    }
    #remove-skin:hover { color: #fff; border-color: rgba(255,255,255,0.6); }

    /* ── Drag overlay ── */
    #drop-overlay {
      position: fixed;
      inset: 0;
      background: rgba(20, 100, 200, 0.25);
      border: 4px dashed rgba(120, 200, 255, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 20;
      pointer-events: none;
    }
    #drop-overlay.active { display: flex; }
    #drop-overlay span {
      font-family: 'Courier New', monospace;
      font-size: 22px;
      color: #fff;
      text-shadow: 2px 2px 6px #000;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="name-overlay">
    <span class="n1">Woods</span>
    <span class="n2">Luikart.com</span>
  </div>

  <div id="drop-hint">Drop a Minecraft skin PNG to apply it</div>
  <button id="remove-skin">&#x2715; Remove skin</button>
  <div id="drop-overlay"><span>Drop skin here</span></div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
  <script>
  (function () {
    'use strict';

    // ─────────────────────────────────────────────
    // CONSTANTS
    // ─────────────────────────────────────────────
    var COLORS = {
      sky:       0x87CEEB,
      grass_top: 0x5D8A1F,
      grass_side:0x7CBF3A,
      dirt:      0x8B5E38,
      log:       0x5A3A1E,
      leaves:    0x2E6B12,
      wireframe: 0x00DD88,
      outline:   0x002a15,
    };

    var BLOCK         = 16;    // Three.js units per Minecraft block (character = 2 blocks = 32u ✓)
    var WALK_SPEED    = 3.5;   // rad/sec limb cycle
    var WALK_AMP      = 0.50;  // max limb swing (rad)
    var HOP_AMP       = 4;     // vertical bob (units) — 1/4 block
    var SCROLL_SPEED  = 40;    // world units/sec — terrain flows toward camera
    var CHUNK_COLS    = 13;    // X-width of terrain: lx = -6..+6 around character
    var CHUNK_Z_ROWS  = 5;     // Z rows per chunk (CHUNK_SPAN = 5×16 = 80u)
    var NUM_CHUNKS    = 8;     // enough to fill -Z ahead and +Z behind camera
    var SKIN_URL_LIMIT = 102400; // 100 KB — skip URL store if larger

    // ─────────────────────────────────────────────
    // SCENE
    // ─────────────────────────────────────────────
    var canvas   = document.getElementById('scene');
    var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);

    var scene = new THREE.Scene();
    scene.background = new THREE.Color(COLORS.sky);
    scene.fog = new THREE.Fog(COLORS.sky, 80, 400);

    // Third-person: camera behind and above character, looking forward into the world.
    // Character at (0, 8, 0); camera at (0, 40, 48) looks over the character's shoulder.
    // FOV 65°, far 800 to accommodate deep forest.
    var camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 1, 800);
    camera.position.set(0, 40, 48);
    camera.lookAt(0, 24, -20); // raised Y: character sits lower in the viewport

    var ambient = new THREE.AmbientLight(0xffffff, 0.75);
    scene.add(ambient);
    var sun = new THREE.DirectionalLight(0xfffde8, 0.9);
    sun.position.set(12, 30, 10);
    scene.add(sun);
    var fill = new THREE.DirectionalLight(0xaaddff, 0.25);
    fill.position.set(-8, -5, 5);
    scene.add(fill);

    window.addEventListener('resize', function () {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ─────────────────────────────────────────────
    // CHARACTER MODEL
    // ─────────────────────────────────────────────
    // Dimensions (Minecraft texel units, matching skinview3d source):
    //   Head 8×8×8  |  Body 8×12×4  |  Arms/Legs 4×12×4
    // Character local coords: feet y=0, head-top y=32.
    //
    // Each body part is a small Group containing:
    //   outlineMesh — BackSide shell scaled 1.09×, dark solid → visible silhouette
    //   wireMesh    — classic wireframe on top
    // The shell is hidden when a skin is applied (skin provides visual weight).

    function makeBodyPart(w, h, d) {
      var geo = new THREE.BoxGeometry(w, h, d);

      var wireMat = new THREE.MeshBasicMaterial({ color: COLORS.wireframe, wireframe: true });
      var wireMesh = new THREE.Mesh(geo, wireMat);

      var outlineMat = new THREE.MeshBasicMaterial({ color: COLORS.outline, side: THREE.BackSide });
      var outlineMesh = new THREE.Mesh(geo, outlineMat);
      outlineMesh.scale.set(1.09, 1.09, 1.09);

      var grp = new THREE.Group();
      grp.add(outlineMesh); // back-face shell first
      grp.add(wireMesh);    // wireframe on top
      return { group: grp, wireMesh: wireMesh, outlineMesh: outlineMesh };
    }

    function buildCharacter() {
      var root = new THREE.Group();
      var outlines = [];

      // Head (center at y=28: 0 feet + 12 legs + 12 body + 4 half-head)
      var headPart = makeBodyPart(8, 8, 8);
      var headGrp  = new THREE.Group();
      headGrp.add(headPart.group);
      headGrp.position.y = 28;
      root.add(headGrp);
      outlines.push(headPart.outlineMesh);

      // Body (center at y=18: 0 + 12 + 6)
      var bodyPart = makeBodyPart(8, 12, 4);
      var bodyGrp  = new THREE.Group();
      bodyGrp.add(bodyPart.group);
      bodyGrp.position.y = 18;
      root.add(bodyGrp);
      outlines.push(bodyPart.outlineMesh);

      // Right Arm — pivot at shoulder (y=24), part offset -6 below pivot
      var rArmPart = makeBodyPart(4, 12, 4);
      rArmPart.group.position.y = -6;
      var rArmPivot = new THREE.Group();
      rArmPivot.add(rArmPart.group);
      rArmPivot.position.set(-6, 24, 0);
      root.add(rArmPivot);
      outlines.push(rArmPart.outlineMesh);

      // Left Arm
      var lArmPart = makeBodyPart(4, 12, 4);
      lArmPart.group.position.y = -6;
      var lArmPivot = new THREE.Group();
      lArmPivot.add(lArmPart.group);
      lArmPivot.position.set(6, 24, 0);
      root.add(lArmPivot);
      outlines.push(lArmPart.outlineMesh);

      // Right Leg — pivot at hip (y=12)
      var rLegPart = makeBodyPart(4, 12, 4);
      rLegPart.group.position.y = -6;
      var rLegPivot = new THREE.Group();
      rLegPivot.add(rLegPart.group);
      rLegPivot.position.set(-2, 12, 0);
      root.add(rLegPivot);
      outlines.push(rLegPart.outlineMesh);

      // Left Leg
      var lLegPart = makeBodyPart(4, 12, 4);
      lLegPart.group.position.y = -6;
      var lLegPivot = new THREE.Group();
      lLegPivot.add(lLegPart.group);
      lLegPivot.position.set(2, 12, 0);
      root.add(lLegPivot);
      outlines.push(lLegPart.outlineMesh);

      return {
        group:     root,
        headGrp:   headGrp,
        rArmPivot: rArmPivot, lArmPivot: lArmPivot,
        rLegPivot: rLegPivot, lLegPivot: lLegPivot,
        // wireMesh refs used by the skin system
        headMesh:  headPart.wireMesh,
        bodyMesh:  bodyPart.wireMesh,
        rArmMesh:  rArmPart.wireMesh,
        lArmMesh:  lArmPart.wireMesh,
        rLegMesh:  rLegPart.wireMesh,
        lLegMesh:  lLegPart.wireMesh,
        outlines:  outlines,
        hasSkin:   false,
      };
    }

    var character = buildCharacter();
    // Front-facing: character faces +Z (toward camera). Camera sees the face.
    // Arm/leg rotation.x swing unchanged — correct walking gait from the front.
    character.group.rotation.y = 0;
    // Ground block center at y=0 → top face at y=BLOCK/2=8 → character feet at y=8 ✓
    character.group.position.set(0, BLOCK / 2, 0);
    scene.add(character.group);

    // ─────────────────────────────────────────────
    // ANIMATION
    // ─────────────────────────────────────────────
    var wireHue = 0;

    function animateCharacter(t) {
      var walkT = t * WALK_SPEED;
      var swing = Math.sin(walkT) * WALK_AMP;

      // Arms/legs swing in opposite phase
      character.rArmPivot.rotation.x =  swing;
      character.lArmPivot.rotation.x = -swing;
      character.rLegPivot.rotation.x = -swing;
      character.lLegPivot.rotation.x =  swing;

      // Vertical bob (two peaks per walk cycle) — bounces between y=8 and y=12
      character.group.position.y = BLOCK / 2 + Math.abs(Math.sin(walkT)) * HOP_AMP;

      // Head: subtle nod (x rotation visible from behind)
      character.headGrp.rotation.x = Math.sin(walkT * 0.5) * 0.04;

      // Hue-cycle the wireframe when no skin is loaded
      if (!character.hasSkin) {
        wireHue = (wireHue + 0.003) % 1;
        var hue = new THREE.Color().setHSL(wireHue, 0.7, 0.55);
        var meshes = [
          character.headMesh, character.bodyMesh,
          character.rArmMesh, character.lArmMesh,
          character.rLegMesh, character.lLegMesh,
        ];
        for (var i = 0; i < meshes.length; i++) {
          meshes[i].material.color.copy(hue);
        }
        // Keep outline colour a dark echo of the current hue
        var darkHue = new THREE.Color().setHSL(wireHue, 0.6, 0.07);
        for (var j = 0; j < character.outlines.length; j++) {
          character.outlines[j].material.color.copy(darkHue);
        }
      }
    }

    // ─────────────────────────────────────────────
    // WORLD / TERRAIN
    // ─────────────────────────────────────────────
    // Third-person world layout:
    //   Chunks are a 2D X×Z grid, scrolling in +Z (flowing past the camera).
    //   X: 13 columns centered on character (lx=-6..+6, ±96u).
    //   Z: 5 rows per chunk (80u span), 8 chunks total (~640u of terrain depth).
    //   Character walks at x=0, z=0 on the flat center path.

    var blockGeo = new THREE.BoxGeometry(BLOCK, BLOCK, BLOCK);

    // 4×4 pixel textures — NearestFilter gives the chunky Minecraft aesthetic.
    function makePixelTex(px) {
      var cv = document.createElement('canvas');
      cv.width = cv.height = 4;
      var ctx = cv.getContext('2d');
      var img = ctx.createImageData(4, 4);
      for (var i = 0; i < 16; i++) {
        img.data[i*4]   = (px[i] >> 16) & 0xff;
        img.data[i*4+1] = (px[i] >>  8) & 0xff;
        img.data[i*4+2] =  px[i]        & 0xff;
        img.data[i*4+3] = 0xff;
      }
      ctx.putImageData(img, 0, 0);
      var t = new THREE.CanvasTexture(cv);
      t.magFilter = t.minFilter = THREE.NearestFilter;
      return t;
    }
    var PX = {
      grassTop: [
        0x5B8A1A, 0x659726, 0x4D7A14, 0x5B8A1A,
        0x659726, 0x4D7A14, 0x5B8A1A, 0x659726,
        0x4D7A14, 0x5B8A1A, 0x659726, 0x4D7A14,
        0x5B8A1A, 0x659726, 0x4D7A14, 0x5B8A1A,
      ],
      grassSide: [
        0x659726, 0x5B8A1A, 0x659726, 0x5B8A1A,
        0x7A5232, 0x8B5E38, 0x5B8A1A, 0x7A5232,
        0x8B5E38, 0x7A5232, 0x8B5E38, 0x7A5232,
        0x7A5232, 0x8B5E38, 0x7A5232, 0x8B5E38,
      ],
      dirt: [
        0x8B5E38, 0x7A5232, 0x96653E, 0x8B5E38,
        0x7A5232, 0x96653E, 0x8B5E38, 0x7A5232,
        0x96653E, 0x8B5E38, 0x7A5232, 0x96653E,
        0x8B5E38, 0x7A5232, 0x96653E, 0x8B5E38,
      ],
      log: [
        0x4A2E14, 0x5A3A1E, 0x5A3A1E, 0x4A2E14,
        0x5A3A1E, 0x5A3A1E, 0x5A3A1E, 0x5A3A1E,
        0x5A3A1E, 0x5A3A1E, 0x5A3A1E, 0x5A3A1E,
        0x4A2E14, 0x5A3A1E, 0x5A3A1E, 0x4A2E14,
      ],
      leaves: [
        0x357A18, 0x2A6010, 0x357A18, 0x2A6010,
        0x2A6010, 0x3D8E1E, 0x2A6010, 0x357A18,
        0x357A18, 0x2A6010, 0x3D8E1E, 0x2A6010,
        0x2A6010, 0x357A18, 0x2A6010, 0x357A18,
      ],
    };

    var matGrassTop  = new THREE.MeshLambertMaterial({ map: makePixelTex(PX.grassTop)  });
    var matGrassSide = new THREE.MeshLambertMaterial({ map: makePixelTex(PX.grassSide) });
    var matDirt      = new THREE.MeshLambertMaterial({ map: makePixelTex(PX.dirt)      });
    var matLog       = new THREE.MeshLambertMaterial({ map: makePixelTex(PX.log)       });
    var matLeaves    = new THREE.MeshLambertMaterial({ map: makePixelTex(PX.leaves)    });

    var grassBlockMat  = [matGrassSide, matGrassSide, matGrassTop, matDirt, matGrassSide, matGrassSide];
    var dirtBlockMat   = [matDirt,   matDirt,   matDirt,   matDirt,   matDirt,   matDirt  ];
    var logBlockMat    = [matLog,    matLog,    matLog,    matLog,    matLog,    matLog   ];
    var leavesBlockMat = [matLeaves, matLeaves, matLeaves, matLeaves, matLeaves, matLeaves];

    function addBlock(parent, x, y, z, mat) {
      var m = new THREE.Mesh(blockGeo, mat);
      m.position.set(x, y, z);
      parent.add(m);
    }

    function seededVal(a, b, c) {
      var n = Math.sin(a * 12.9898 + b * 78.233 + c * 43.1) * 43758.5453;
      return n - Math.floor(n);
    }

    // Build one terrain chunk centered on x=0.
    // startAbsZ = absolute block-Z index of the chunk's first row (for seeding).
    // X: lx = -6..+6 (13 columns, centered on character).
    // Z: lz = 0..CHUNK_Z_ROWS-1 (local; world Z = chunk.position.z + lz*BLOCK).
    // Center path (|lx| ≤ 2) is always flat — hills grow toward the edges.
    // Trees only at |lx| ≥ 3, keeping the 5-block-wide walking lane clear.
    function buildChunk(startAbsZ) {
      var group = new THREE.Group();
      for (var lx = -6; lx <= 6; lx++) {
        for (var lz = 0; lz < CHUNK_Z_ROWS; lz++) {
          var absZ  = startAbsZ + lz;
          var bx    = lx * BLOCK;
          var bz    = lz * BLOCK;

          // Height: zero on path, rolling hills toward edges
          var dist  = Math.max(0, Math.abs(lx) - 2);        // 0 for |lx|≤2
          var edgeF = Math.min(1, dist / 4);                 // 0→1 ramp
          var rawH  = Math.sin(lx * 0.32 + absZ * 0.11) * 2 +
                      Math.cos(absZ * 0.19 + lx * 0.17) * 1.5;
          var surfH = Math.round(rawH * edgeF);

          var by = surfH * BLOCK;
          addBlock(group, bx, by,         bz, grassBlockMat);
          addBlock(group, bx, by - BLOCK, bz, dirtBlockMat);

          // Trees: only in the outer columns, ~14% density, 5-7 blocks tall
          if (Math.abs(lx) >= 3 && seededVal(lx, absZ, 7) > 0.86) {
            var tH = Math.floor(seededVal(lx, absZ, 11) * 3) + 5;
            for (var ty = 1; ty <= tH; ty++) {
              addBlock(group, bx, by + ty * BLOCK, bz, logBlockMat);
            }
            // 3×3 leaf ring around top two trunk levels + single top cap
            for (var llz = -1; llz <= 1; llz++) {
              for (var llx = -1; llx <= 1; llx++) {
                if (llx === 0 && llz === 0) continue;
                addBlock(group, bx + llx*BLOCK, by + tH*BLOCK,       bz + llz*BLOCK, leavesBlockMat);
                addBlock(group, bx + llx*BLOCK, by + (tH-1)*BLOCK,   bz + llz*BLOCK, leavesBlockMat);
              }
            }
            addBlock(group, bx, by + (tH + 1) * BLOCK, bz, leavesBlockMat);
          }
        }
      }
      group.userData.startAbsZ = startAbsZ;
      return group;
    }

    // Ground block center at y=0 → top face at y=BLOCK/2=8 → character feet at BLOCK/2 ✓
    var worldGroup = new THREE.Group();
    scene.add(worldGroup);

    // CHUNK_SPAN = Z-extent per chunk = CHUNK_Z_ROWS × BLOCK = 5 × 16 = 80u.
    // Chunks spread in -Z (ahead of character). The first chunk sits at z=0, covering
    // world z=0..+64 — terrain right between character and camera from frame 1.
    var CHUNK_SPAN = CHUNK_Z_ROWS * BLOCK;
    var chunks = [];
    for (var ci = 0; ci < NUM_CHUNKS; ci++) {
      var startZ    = (1 - ci) * CHUNK_SPAN;       // +80, 0, -80, …, -480
      var startAbsZ = Math.round(startZ / BLOCK); // +5, 0, -5, …, -30
      var chk       = buildChunk(startAbsZ);
      chk.position.z = startZ;
      worldGroup.add(chk);
      chunks.push(chk);
    }

    function updateWorld(dt) {
      for (var i = 0; i < chunks.length; i++) {
        var c = chunks[i];
        c.position.z -= SCROLL_SPEED * dt; // world flows toward -Z, into the distance

        // Recycle once the chunk has scrolled far enough into the fog (-Z side)
        if (c.position.z < -560) {
          var maxZ = -Infinity;
          for (var j = 0; j < chunks.length; j++) {
            if (chunks[j].position.z > maxZ) maxZ = chunks[j].position.z;
          }
          var newPosZ      = maxZ + CHUNK_SPAN;
          var newStartAbsZ = Math.round(newPosZ / BLOCK);
          c.position.z     = newPosZ;

          // Rebuild with fresh terrain for the new position
          while (c.children.length > 0) c.remove(c.children[0]);
          var rebuilt = buildChunk(newStartAbsZ);
          c.userData.startAbsZ = newStartAbsZ;
          while (rebuilt.children.length > 0) c.add(rebuilt.children[0]);
        }
      }
    }

    // ─────────────────────────────────────────────
    // SKIN SYSTEM
    // ─────────────────────────────────────────────
    // Minecraft skin UV layout (64×64 PNG, y=0 at top-left).
    // BoxGeometry face order: right(+x), left(-x), top(+y), bottom(-y), front(+z), back(-z).

    var SKIN_UVS = {
      head: [
        [16, 8, 8, 8], [0,  8, 8, 8],
        [8,  0, 8, 8], [16, 0, 8, 8],
        [8,  8, 8, 8], [24, 8, 8, 8],
      ],
      body: [
        [28, 20, 4, 12], [16, 20, 4, 12],
        [20, 16, 8,  4], [28, 16, 8,  4],
        [20, 20, 8, 12], [32, 20, 8, 12],
      ],
      rightArm: [
        [48, 20, 4, 12], [40, 20, 4, 12],
        [44, 16, 4,  4], [48, 16, 4,  4],
        [44, 20, 4, 12], [52, 20, 4, 12],
      ],
      leftArm_modern: [
        [40, 52, 4, 12], [32, 52, 4, 12],
        [36, 48, 4,  4], [40, 48, 4,  4],
        [36, 52, 4, 12], [44, 52, 4, 12],
      ],
      rightLeg: [
        [8,  20, 4, 12], [0,  20, 4, 12],
        [4,  16, 4,  4], [8,  16, 4,  4],
        [4,  20, 4, 12], [12, 20, 4, 12],
      ],
      leftLeg_modern: [
        [24, 52, 4, 12], [16, 52, 4, 12],
        [20, 48, 4,  4], [24, 48, 4,  4],
        [20, 52, 4, 12], [28, 52, 4, 12],
      ],
    };

    function mirrorUVs(uvs) {
      var m = uvs.slice();
      var tmp = m[0]; m[0] = m[1]; m[1] = tmp;
      return m;
    }

    function applyUVRegions(geometry, regions) {
      var uvData = [];
      var W = 64, H = 64;
      for (var f = 0; f < 6; f++) {
        var r  = regions[f];
        var u0 = r[0] / W,         u1 = (r[0] + r[2]) / W;
        var v1 = 1 - r[1] / H,     v0 = 1 - (r[1] + r[3]) / H;
        uvData.push(u0, v1,  u1, v1,  u0, v0,  u1, v0);
      }
      geometry.setAttribute('uv', new THREE.BufferAttribute(new Float32Array(uvData), 2));
    }

    var dropHint     = document.getElementById('drop-hint');
    var removeSkinBtn = document.getElementById('remove-skin');

    var SkinSystem = (function () {
      var currentTex = null;

      function applyTexture(texture, isModern) {
        texture.magFilter = THREE.NearestFilter;
        texture.minFilter = THREE.NearestFilter;
        texture.needsUpdate = true;

        var leftArmUVs = isModern ? SKIN_UVS.leftArm_modern  : mirrorUVs(SKIN_UVS.rightArm);
        var leftLegUVs = isModern ? SKIN_UVS.leftLeg_modern  : mirrorUVs(SKIN_UVS.rightLeg);

        var parts = [
          { mesh: character.headMesh, uvs: SKIN_UVS.head     },
          { mesh: character.bodyMesh, uvs: SKIN_UVS.body     },
          { mesh: character.rArmMesh, uvs: SKIN_UVS.rightArm },
          { mesh: character.lArmMesh, uvs: leftArmUVs        },
          { mesh: character.rLegMesh, uvs: SKIN_UVS.rightLeg },
          { mesh: character.lLegMesh, uvs: leftLegUVs        },
        ];

        for (var i = 0; i < parts.length; i++) {
          applyUVRegions(parts[i].mesh.geometry, parts[i].uvs);
          parts[i].mesh.material.dispose();
          parts[i].mesh.material = new THREE.MeshLambertMaterial({
            map: texture, transparent: true, alphaTest: 0.1,
          });
        }

        character.hasSkin = true;
        // Outline shells are redundant once a real skin is applied
        for (var k = 0; k < character.outlines.length; k++) {
          character.outlines[k].visible = false;
        }

        if (currentTex && currentTex !== texture) currentTex.dispose();
        currentTex = texture;

        removeSkinBtn.style.display = 'block';
        dropHint.textContent = 'Skin applied! Drop another to change it.';
      }

      function resetToWireframe() {
        var meshes = [
          character.headMesh, character.bodyMesh,
          character.rArmMesh, character.lArmMesh,
          character.rLegMesh, character.lLegMesh,
        ];
        for (var i = 0; i < meshes.length; i++) {
          meshes[i].material.dispose();
          meshes[i].material = new THREE.MeshBasicMaterial({
            color: COLORS.wireframe, wireframe: true,
          });
        }
        for (var k = 0; k < character.outlines.length; k++) {
          character.outlines[k].visible = true;
        }
        character.hasSkin = false;
        if (currentTex) { currentTex.dispose(); currentTex = null; }
      }

      // Shared helper: load a DataURL as a texture then apply it.
      function loadFromDataUrl(dataUrl, isModern) {
        var loader = new THREE.TextureLoader();
        loader.load(dataUrl, function (tex) { applyTexture(tex, isModern); });
      }

      function handleFile(file) {
        if (!file || file.type !== 'image/png') return;
        var fileSize = file.size; // capture before async read
        var reader   = new FileReader();
        reader.onload = function (e) {
          var dataUrl = e.target.result;
          var img = new Image();
          img.onload = function () {
            var w = img.width, h = img.height;
            if (w !== 64 || (h !== 64 && h !== 32)) return; // not a valid skin
            var isModern = (h === 64);

            // Persist skin in URL so it survives a page reload / can be shared
            if (fileSize <= SKIN_URL_LIMIT) {
              try {
                var params = new URLSearchParams();
                params.set('skin', dataUrl);
                history.replaceState(null, '', '?' + params.toString());
              } catch (_) { /* URL too long or replaceState unavailable */ }
            }

            loadFromDataUrl(dataUrl, isModern);
          };
          img.src = dataUrl;
        };
        reader.readAsDataURL(file);
      }

      return { handleFile: handleFile, resetToWireframe: resetToWireframe, loadFromDataUrl: loadFromDataUrl };
    })();

    // ─────────────────────────────────────────────
    // REMOVE SKIN BUTTON
    // ─────────────────────────────────────────────
    removeSkinBtn.addEventListener('click', function () {
      SkinSystem.resetToWireframe();
      history.replaceState(null, '', location.pathname); // clear URL param
      dropHint.textContent = 'Drop a Minecraft skin PNG to apply it';
      removeSkinBtn.style.display = 'none';
    });

    // ─────────────────────────────────────────────
    // DRAG-AND-DROP
    // ─────────────────────────────────────────────
    var dropOverlay = document.getElementById('drop-overlay');
    var dragDepth   = 0;

    document.addEventListener('dragenter', function (e) {
      e.preventDefault(); dragDepth++;
      dropOverlay.classList.add('active');
    });
    document.addEventListener('dragover',  function (e) { e.preventDefault(); });
    document.addEventListener('dragleave', function () {
      if (--dragDepth <= 0) { dragDepth = 0; dropOverlay.classList.remove('active'); }
    });
    document.addEventListener('drop', function (e) {
      e.preventDefault();
      dragDepth = 0;
      dropOverlay.classList.remove('active');
      var file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (file) SkinSystem.handleFile(file);
    });

    // ─────────────────────────────────────────────
    // URL SKIN RESTORE
    // ─────────────────────────────────────────────
    // On load, check ?skin= for a base64-encoded DataURL from a previous session.
    (function tryRestoreSkinFromURL() {
      var params   = new URLSearchParams(window.location.search);
      var skinData = params.get('skin');
      if (!skinData || skinData.indexOf('data:image/png') !== 0) return;

      var img = new Image();
      img.onload = function () {
        if (img.width !== 64 || (img.height !== 64 && img.height !== 32)) return;
        SkinSystem.loadFromDataUrl(skinData, img.height === 64);
      };
      img.src = skinData;
    })();

    // ─────────────────────────────────────────────
    // MAIN LOOP
    // ─────────────────────────────────────────────
    var clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      var dt = Math.min(clock.getDelta(), 0.05);
      var t  = clock.getElapsedTime();
      animateCharacter(t);
      updateWorld(dt);
      renderer.render(scene, camera);
    }

    animate();
  })();
  </script>
</body>
</html>
